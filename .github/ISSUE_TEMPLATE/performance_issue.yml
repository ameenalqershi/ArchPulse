name: "Performance issue"
description: "Report measured performance or scalability concerns"
title: "[PERFORMANCE_ISSUE] "
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: "Read CONTRIBUTING.md. Never publish secrets or exploit details."
  - type: input
    id: source-task
    attributes:
      label: "Notion task Txxx / spec Sxx (if applicable)"
      placeholder: "T001 / S00"
  - type: textarea
    id: context
    attributes:
      label: "Measured workload and baseline"
      description: "Explain precisely; distinguish observed facts from proposals."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Reproduction and profiling evidence"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: "Expected budget and regression tests"
      description: "Include test approach, evidence and links without personal data."
    validations:
      required: true
