name: "Bug report"
description: "Report a reproducible defect"
title: "[BUG_REPORT] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Read CONTRIBUTING.md. Never publish secrets or exploit details."
  - type: input
    id: source-task
    attributes:
      label: "Notion task Txxx / spec Sxx (if applicable)"
      placeholder: "T001 / S00"
  - type: textarea
    id: context
    attributes:
      label: "Expected behavior"
      description: "Explain precisely; distinguish observed facts from proposals."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Actual behavior"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: "Reproduction steps and environment"
      description: "Include test approach, evidence and links without personal data."
    validations:
      required: true
