name: "Feature proposal"
description: "Propose a capability linked to a specification"
title: "[FEATURE_REQUEST] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Read CONTRIBUTING.md. Never publish secrets or exploit details."
  - type: input
    id: source-task
    attributes:
      label: "Notion task Txxx / spec Sxx (if applicable)"
      placeholder: "T001 / S00"
  - type: textarea
    id: context
    attributes:
      label: "Problem and desired outcome"
      description: "Explain precisely; distinguish observed facts from proposals."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "User value and acceptance criteria"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: "Alternatives and dependencies"
      description: "Include test approach, evidence and links without personal data."
    validations:
      required: true
