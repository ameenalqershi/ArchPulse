name: Foundation CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation-build-test:
    name: foundation-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4 ref as of 2026-11-10
        with:
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # pinned v4 ref as of 2026-11-10
        with:
          dotnet-version: 10.0.x
      - name: SDK version
        run: dotnet --info
      - name: Restore
        run: dotnet restore ArchPulse.sln --locked-mode
      - name: Build
        run: dotnet build ArchPulse.sln --no-restore --configuration Release
      - name: Unit tests
        run: dotnet test ArchPulse.sln --no-build --configuration Release --logger 'trx;LogFileName=unit-tests.trx'
  foundation-document-check:
    name: foundation-document-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check foundation structure, license, links and templates
        run: python3 scripts/validate_foundation.py
