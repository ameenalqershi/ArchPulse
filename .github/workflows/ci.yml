name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-build-test:
    name: foundation-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Locked restore
        run: dotnet restore ArchPulse.sln --locked-mode
      - name: Build
        run: dotnet build ArchPulse.sln --no-restore --configuration Release
      - name: Unit and semantic integration tests
        run: dotnet test ArchPulse.sln --no-build --no-restore --configuration Release --logger 'trx;LogFileName=foundation-ci.trx'
      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build Web Studio from locked dependencies
        working-directory: apps/web-studio
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

  foundation-document-check:
    name: foundation-document-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Locked restore
        run: dotnet restore ArchPulse.sln --locked-mode
      - name: Build native tooling
        run: dotnet build ArchPulse.sln --no-restore --configuration Release
      - name: Validate repository
        run: dotnet run --project tooling/ArchPulse.RepositoryValidator --configuration Release --no-build
      - name: Validate traceability
        run: dotnet run --project tooling/ArchPulse.TraceabilityValidator --configuration Release --no-build
