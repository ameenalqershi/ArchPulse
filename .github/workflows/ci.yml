name: Foundation CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation-build-test:
    name: foundation-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - name: SDK version
        run: dotnet --info
      - name: Locked restore
        run: dotnet restore ArchPulse.sln --locked-mode
      - name: Restore golden multi-project solution without paid dependencies
        run: dotnet restore examples/billing-multi-project/Billing.sln --locked-mode
      - name: Restore real MVC/handler/test feature signal fixture without paid dependencies
        run: dotnet restore examples/feature-signals/FeatureSignals.sln --locked-mode
      - name: Restore source-only sensitive dataflow corpus (T027) without paid dependencies
        run: dotnet restore examples/datajourney-local/DataJourney.sln --locked-mode
      - name: Restore the S06 cross-project dataflow fixture
        run: dotnet restore examples/datajourney-cross-project/Journey.slnx --locked-mode
      - name: Release build
        run: dotnet build ArchPulse.sln --no-restore --configuration Release
      - name: Unit, graph and validator regression tests
        run: dotnet test ArchPulse.sln --no-build --configuration Release --logger 'trx;LogFileName=archpulse-tests.trx'
      - name: MCP streamable-HTTP and UI resource protocol smoke
        run: bash scripts/ci-mcp-protocol.sh
      - name: Exact source-backed feature catalog import and projection (S05/T023 partial)
        run: bash scripts/ci-feature-atlas.sh
      - name: Exact Roslyn ASP.NET/Handler/Test source signals (S05/T024 partial)
        run: bash scripts/ci-feature-discovery.sh
      - name: Real two-revision static feature impact and source call witness (S05/T025 partial)
        run: bash scripts/ci-feature-impact.sh
      - name: Immutable local operator feature-review receipt and rollback (S05/T026 partial)
        run: bash scripts/ci-feature-review.sh
      - name: Source-only annotated local dataflow and negative corpus (S06/T027 partial)
        run: bash scripts/ci-datajourney-local.sh
      - name: Bounded static cross-project value flow with graph witnesses (S06/T028 partial)
        run: bash scripts/ci-datajourney-cross-project.sh
      - name: DataJourney zone policy, privacy corpus and accessible local report (S06/T029-T031 partial)
        run: bash scripts/ci-datajourney-review.sh
      - name: Native results-only TRX evidence smoke (S33 partial)
        run: bash scripts/ci-test-journey-results.sh
      - name: Explicit local test-run process and content-digest receipt (S33 partial)
        run: bash scripts/ci-local-test-run-capture.sh
      - name: Real TRX-to-Roslyn test declaration name candidates (S33 partial)
        run: bash scripts/ci-trx-source-candidates.sh
      - name: Real-source static test associations and immutable sidecar smoke (S31 partial)
        run: bash scripts/ci-static-test-links.sh
      - name: Native S26 requirement baseline lock and proposed scope validation
        run: dotnet run --project tooling/ArchPulse.TraceabilityValidator --no-build --configuration Release -- --root . --baseline
      - name: Native S25 all-agent-handoff checkpoint and secret hygiene validation
        run: dotnet run --project tooling/ArchPulse.RepositoryValidator --no-build --configuration Release -- --root . --handoffs
      - name: Offline foundation validation - native .NET
        run: dotnet run --project tooling/ArchPulse.RepositoryValidator --no-build --configuration Release
      - name: Offline S/T/R traceability validation - native .NET
        run: dotnet run --project tooling/ArchPulse.TraceabilityValidator --no-build --configuration Release
      - name: Native offline NuGet metadata audit (pending reviews stay explicit)
        run: dotnet run --project tooling/ArchPulse.LicenseAudit --no-build --configuration Release -- --repo . --output /tmp/archpulse-nuget-license-audit.json
  foundation-document-check:
    name: foundation-document-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - name: Locked tooling restore
        run: dotnet restore tooling/ArchPulse.RepositoryValidator/ArchPulse.RepositoryValidator.csproj --locked-mode
      - name: Build tooling
        run: dotnet build tooling/ArchPulse.RepositoryValidator/ArchPulse.RepositoryValidator.csproj --no-restore --configuration Release
      - name: Repository and handoff contracts
        run: dotnet run --project tooling/ArchPulse.RepositoryValidator --no-build --configuration Release
      - name: All handoffs and immutable S26 requirements snapshot
        run: |
          dotnet run --project tooling/ArchPulse.RepositoryValidator --no-build --configuration Release -- --root . --handoffs
          dotnet run --project tooling/ArchPulse.TraceabilityValidator --no-build --configuration Release -- --root . --baseline
      - name: Assert remaining Python tools are retired
        run: |
          if [ -n "$(git ls-files '*.py')" ]; then
            echo "Python tooling remains tracked after native retirement." >&2
            git ls-files '*.py'
            exit 1
          fi
      - name: Traceability contracts
        run: dotnet run --project tooling/ArchPulse.TraceabilityValidator --no-build --configuration Release
  web-studio-build-test:
    name: web-studio-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js (pinned setup action)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web-studio/package-lock.json
      - name: Locked install (Web Studio only)
        run: npm ci --prefix apps/web-studio
      - name: TypeScript and React production build
        run: npm run build --prefix apps/web-studio
      - name: Web graph identity and Mermaid tests
        run: npm run test --prefix apps/web-studio
      - name: Audit frontend packages
        run: npm audit --prefix apps/web-studio --audit-level=high
