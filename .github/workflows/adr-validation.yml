# SPDX-License-Identifier: Apache-2.0
name: ADR Governance Contract
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adr-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adr-contract:
    name: adr-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7
        with:
          persist-credentials: false
      - name: Install .NET SDK for native traceability gate
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - name: Locked native tooling restore
        run: |
          dotnet restore tooling/ArchPulse.RepositoryValidator/ArchPulse.RepositoryValidator.csproj --locked-mode
          dotnet restore tooling/ArchPulse.Tooling.Tests/ArchPulse.Tooling.Tests.csproj --locked-mode
      - name: Build native validators and adversarial tests
        run: dotnet build tooling/ArchPulse.Tooling.Tests/ArchPulse.Tooling.Tests.csproj -c Release --no-restore
      - name: Validate source traceability with native C#
        run: dotnet run --project tooling/ArchPulse.TraceabilityValidator -c Release --no-build -- --root .
      - name: Verify ADR schema, lifecycle, receipts and narrative with native C#
        run: dotnet run --project tooling/ArchPulse.RepositoryValidator -c Release --no-build -- --root . --adr
      - name: Adversarial ADR contract tests in xUnit
        run: dotnet test tooling/ArchPulse.Tooling.Tests/ArchPulse.Tooling.Tests.csproj -c Release --no-build --filter FullyQualifiedName~AdrValidationTests
